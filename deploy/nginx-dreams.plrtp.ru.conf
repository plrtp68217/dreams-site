# Host nginx for dreams.plrtp.ru → the docker "web" container on 127.0.0.1:8080.
# Install:  sudo cp deploy/nginx-dreams.plrtp.ru.conf /etc/nginx/sites-available/dreams.plrtp.ru
#           sudo ln -s /etc/nginx/sites-available/dreams.plrtp.ru /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d dreams.plrtp.ru     # adds HTTPS and the http→https redirect
server {
    listen 80;
    listen [::]:80;
    server_name dreams.plrtp.ru;

    # images are uploaded up to 10 MB
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
