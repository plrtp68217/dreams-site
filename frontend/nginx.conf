# Inside the "web" container: serves the built frontend and proxies the API to the backend container.
# TLS and the domain are handled by nginx on the host (deploy/nginx-dreams.plrtp.ru.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # images are uploaded up to 10 MB (DREAMS_MAX_UPLOAD_MB)
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        expires 30d;
    }

    # hashed build files never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routes (/s/ff, /tasks, …)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
